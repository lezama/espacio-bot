title: Hoy en el espacio
description: Una noticia del espacio por día, contada para niñas de 8 a 12 años.
url: "https://lezama.github.io"
baseurl: "/espacio-bot"
lang: es-UY
timezone: America/Montevideo
permalink: /:year/:month/:day/
plugins:
  - jekyll-feed
defaults:
  - scope:
      type: posts
    values:
      layout: post
exclude:
  - fetch.py
  - prompt.md
  - README.md
  - LICENSE
