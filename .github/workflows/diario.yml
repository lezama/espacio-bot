name: Post del día

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 en Uruguay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - run: python bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - run: |
          git config user.name espacio-bot
          git config user.email actions@github.com
          git add _posts
          git diff --cached --quiet || git commit -m "post $(TZ=America/Montevideo date +%F)"
          git push
