name: Pedir el post del día

on:
  schedule:
    - cron: '17 10 * * *'   # 07:17 en Uruguay; en punto GitHub lo retrasa horas
  workflow_dispatch:

permissions: {}

jobs:
  issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          HOY=$(TZ=America/Montevideo date +%F)
          if [ -n "$(gh issue list --label dia --state open --json number --jq '.[0].number')" ]; then
            echo "Hay un issue abierto, el agente sigue trabajando"; exit 0
          fi
          if gh api "repos/$GH_REPO/contents/_posts/$HOY-espacio.md" >/dev/null 2>&1; then
            echo "El post de $HOY ya existe"; exit 0
          fi
          gh issue create --label dia --assignee "@copilot" --title "[dia] $HOY" \
            --body "Escribí el post de hoy siguiendo .github/copilot-instructions.md."
