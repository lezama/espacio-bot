name: Pedir el post del día

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 en Uruguay
  workflow_dispatch:

permissions: {}

jobs:
  issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          HOY=$(TZ=America/Montevideo date +%F)
          if [ -n "$(gh issue list -R "$REPO" --label dia --state open --json number --jq '.[0].number')" ]; then
            echo "Hay un issue abierto, el agente sigue trabajando"; exit 0
          fi
          if gh api "repos/$REPO/contents/_posts/$HOY-espacio.md" >/dev/null 2>&1; then
            echo "El post de $HOY ya existe"; exit 0
          fi
          URL=$(gh issue create -R "$REPO" --label dia --title "[dia] $HOY" \
            --body "Escribí el post de hoy siguiendo .github/copilot-instructions.md. Cuando abras el PR poné \`Closes #<este issue>\` en el body.")
          gh api -X POST "repos/$REPO/issues/${URL##*/}/assignees" -f 'assignees[]=copilot-swe-agent[bot]'
