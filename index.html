---
layout: default
---
{% assign hoy = site.posts.first %}
{% include post.html post=hoy content=hoy.content %}
{% if site.posts.size > 1 %}
<section class="anteriores">
  <h2>Días anteriores</h2>
  <ul>
    {% for post in site.posts offset:1 limit:30 %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span class="fecha">{% include fecha.html t=post.date %}</span></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
